<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QlickLeads — RPO</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --b1:#0f2942;--b2:#17395c;--b3:#2563c9;--b4:#3d82c4;--bp:#eaf2fa;
  --g1:#134532;--g2:#22a06b;--g3:#2f9668;--gp:#e8f5ee;
  --t1:#0e9aae;--tp:#e6f4f7;--a1:#f0a02a;--ap:#fdf0dd;
  --r1:#e8615a;--rp:#fbeae8;--p1:#7c5cc4;--pp:#f0eafa;--o1:#c2551f;--op:#fdeee4;
  --w:#fff;--g50:#f8fafc;--g100:#f1f4f8;--g200:#e4e9f0;--g300:#cdd5e0;
  --g400:#94a0b3;--g500:#66718a;--g600:#48526b;--g700:#2f374a;--g800:#1b2233;
  --sw:232px;--rad:16px;--rad-s:10px;
  --sh:0 1px 3px rgba(15,41,66,.04);--sh-m:0 4px 16px rgba(15,41,66,.07);--sh-l:0 12px 40px rgba(15,41,66,.16);
  --grad:linear-gradient(135deg,var(--b1) 0%,var(--b2) 55%,#125a48 130%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eef2f7;color:var(--g700);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;letter-spacing:-.01em}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--grad)}
.login-card{background:#fff;border-radius:14px;padding:38px;width:100%;max-width:400px;box-shadow:var(--sh-l)}
.err-box{background:var(--rp);color:var(--r1);border-radius:var(--rad-s);padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:none}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--grad);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto;transition:transform .22s}
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .22s}
body.sb-collapsed .sidebar{transform:translateX(-100%)}
body.sb-collapsed .main{margin-left:0}
.sb-logo{padding:16px}
.sb-logo .box{background:#fff;border-radius:10px;padding:11px 13px;display:flex;align-items:center;justify-content:center}
.sb-logo img{width:135px;max-width:100%;height:auto;display:block}
.sb-logo .sub{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:8px;text-align:center}
.sb-nav{padding:8px;flex:1}
.sb-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.38);letter-spacing:.09em;text-transform:uppercase;padding:12px 10px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--rad-s);cursor:pointer;color:rgba(255,255,255,.72);font-size:13px;font-weight:500;transition:all .13s;border:none;background:none;width:100%;text-align:left;margin-bottom:1px}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.nav-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.28);flex-shrink:0}
.nav-item.active .nav-dot{background:var(--g2);box-shadow:0 0 6px var(--g2)}
.sb-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.1)}
.sb-user .un{font-size:12.5px;font-weight:600;color:#fff}
.sb-user .ue{font-size:10.5px;color:rgba(255,255,255,.45)}
.topbar{height:62px;background:#fff;border-radius:var(--rad);border:1px solid rgba(15,41,66,.06);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:14px;z-index:40;box-shadow:var(--sh);margin:14px 20px 0}
.topbar h1{font-size:19px;font-weight:700;color:var(--g800);letter-spacing:-.03em}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid var(--g200);border-radius:var(--rad-s);color:var(--g600);font-size:16px;cursor:pointer;padding:5px 9px}
.menu-btn:hover{background:var(--g100);color:var(--b3)}
.topbar-l{display:flex;align-items:center;gap:13px}
.topbar-r{display:flex;gap:8px;align-items:center}
.page{padding:18px 20px 26px;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;font-family:inherit}
.btn-primary{background:var(--b3);color:#fff;border-color:var(--b3);box-shadow:0 2px 8px rgba(37,99,201,.22)}.btn-primary:hover{background:#1d51a8}
.btn-green{background:var(--g2);color:#fff;border-color:var(--g2)}.btn-green:hover{background:#1a8054}
.btn-outline{background:#fff;color:var(--g600);border-color:var(--g300)}.btn-outline:hover{border-color:var(--b3);color:var(--b3);background:var(--bp)}
.btn-ghost{background:transparent;color:var(--g500);border-color:transparent;padding:7px 11px}.btn-ghost:hover{background:var(--g100);color:var(--b3)}
.btn-danger{background:#fff;color:var(--r1);border-color:#e6b8b3}.btn-danger:hover{background:var(--rp)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-xs{padding:4px 10px;font-size:11.5px;border-radius:7px}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-row{margin-bottom:13px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-label{display:block;font-size:11.5px;font-weight:600;color:var(--g600);margin-bottom:5px}
.form-label .req{color:var(--r1);margin-left:2px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 11px;border:1px solid var(--g300);border-radius:var(--rad-s);font-size:13px;color:var(--g800);background:#fff;font-family:inherit;outline:none;transition:border-color .13s,box-shadow .13s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--b3);box-shadow:0 0 0 3px rgba(37,99,201,.12)}
.form-textarea{resize:vertical;min-height:72px}
.form-hint{font-size:11px;color:var(--g400);margin-top:3px}
.fs{background:var(--g50);border-radius:var(--rad-s);padding:14px;margin-bottom:14px;border:1px solid var(--g200)}
.fs-title{font-size:10.5px;font-weight:700;color:var(--b3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:11px}
.card{background:#fff;border-radius:var(--rad);border:1px solid rgba(15,41,66,.06);box-shadow:var(--sh)}
.card-hdr{padding:16px 20px 13px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.card-hdr h3{font-size:15px;font-weight:700;color:var(--g800);letter-spacing:-.02em}
.card-body{padding:18px 20px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.metric{background:#fff;border-radius:var(--rad);border:1px solid rgba(15,41,66,.06);padding:17px 19px;box-shadow:var(--sh);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.m-ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.metric.blue .m-ico{background:#2563c9}.metric.green .m-ico{background:#22a06b}.metric.teal .m-ico{background:#0e9aae}
.metric.amber .m-ico{background:#f0a02a}.metric.red .m-ico{background:#e8615a}.metric.purple .m-ico{background:#7c5cc4}
.metric.gray .m-ico{background:var(--g400)}
.m-lbl{font-size:12px;color:var(--g500);font-weight:500;margin-bottom:6px}
.m-val{font-size:28px;font-weight:700;line-height:1;color:var(--g800);letter-spacing:-.035em}
.m-sub{font-size:11.5px;color:var(--g400);margin-top:7px}
.tbl-wrap{overflow-x:auto;border-radius:var(--rad);border:1px solid rgba(15,41,66,.06);background:#fff;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#f7f9fc;padding:12px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--g500);border-bottom:1px solid var(--g200);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f7f9fc}
.td-name{font-weight:600;color:var(--g800)}
.td-link{cursor:pointer;color:var(--b3);font-weight:600}.td-link:hover{text-decoration:underline}
.td-sub{font-size:11px;color:var(--g400);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap}
.bdg-blue{background:var(--bp);color:var(--b2)}.bdg-green{background:var(--gp);color:var(--g1)}
.bdg-teal{background:var(--tp);color:var(--t1)}.bdg-amber{background:var(--ap);color:#92590e}
.bdg-red{background:var(--rp);color:#a02f26}.bdg-gray{background:var(--g100);color:var(--g600)}
.bdg-purple{background:var(--pp);color:var(--p1)}.bdg-orange{background:var(--op);color:var(--o1)}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(15,41,66,.5);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:660px;max-height:93vh;overflow-y:auto;box-shadow:var(--sh-l)}
.modal.lg{max-width:860px}
.modal-hdr{padding:17px 22px 13px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;border-radius:12px 12px 0 0}
.modal-hdr h2{font-size:15px;font-weight:700;color:var(--g800)}
.modal-body{padding:19px 22px}
.modal-ftr{padding:13px 22px;border-top:1px solid var(--g100);display:flex;justify-content:flex-end;gap:9px;background:var(--g50);border-radius:0 0 12px 12px}
.close-x{background:none;border:none;font-size:22px;color:var(--g400);cursor:pointer;line-height:1}
.subtabs{display:flex;gap:6px;background:#fff;border:1px solid rgba(15,41,66,.06);border-radius:var(--rad-s);padding:5px;margin-bottom:18px;box-shadow:var(--sh);width:fit-content;flex-wrap:wrap}
.subtab{padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--g500);border-radius:8px;transition:all .15s;background:none;border:none}
.subtab:hover{color:var(--b3);background:var(--bp)}
.subtab.active{color:#fff;background:var(--b3);box-shadow:0 2px 8px rgba(37,99,201,.24)}
.subtab .cnt{display:inline-block;margin-left:7px;font-size:10.5px;background:var(--g100);color:var(--g500);padding:2px 8px;border-radius:20px}
.subtab.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.filter-row{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filter-row .form-input,.filter-row .form-select{max-width:220px}
.empty-state{text-align:center;padding:44px 20px}
.empty-state .ei{font-size:34px;margin-bottom:10px;opacity:.55}
.empty-state h3{font-size:14px;font-weight:700;color:var(--g700);margin-bottom:6px}
.empty-state p{font-size:12.5px;color:var(--g400);margin-bottom:16px}
.toast{position:fixed;bottom:22px;right:22px;padding:11px 18px;border-radius:var(--rad-s);font-size:12.5px;z-index:999;box-shadow:var(--sh-l);display:none;color:#fff;font-weight:600}
.toast.show{display:block}.toast.ok{background:var(--g2)}.toast.err{background:var(--r1)}.toast.info{background:var(--b3)}
.pipe-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pipe-lbl{width:130px;font-size:11.5px;color:var(--g600);flex-shrink:0}
.pipe-bar-w{flex:1;height:8px;background:var(--g100);border-radius:4px;overflow:hidden}
.pipe-bar{height:100%;border-radius:4px}
.pipe-cnt{width:30px;text-align:right;font-size:12px;font-weight:700;color:var(--g700)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49}
.sidebar-overlay.open{display:block}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .metrics{grid-template-columns:repeat(2,1fr)!important;gap:10px}
  .form-grid{grid-template-columns:1fr}
  .topbar{margin:10px;padding:0 14px}
  .page{padding:12px 10px}
}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:26px">
      <img src="/assets/logo-full.png" alt="QlickLeads" style="width:200px;max-width:70%;height:auto;margin:0 auto 8px;display:block">
      <p style="font-size:12.5px;color:var(--g400)">Recruitment Process Outsourcing</p>
    </div>
    <div class="err-box" id="login-err"></div>
    <div class="form-row"><label class="form-label">Email<span class="req">*</span></label>
      <input class="form-input" id="li-email" type="email" placeholder="you@company.com"></div>
    <div class="form-row"><label class="form-label">Password<span class="req">*</span></label>
      <input class="form-input" id="li-pass" type="password" placeholder="••••••••"></div>
    <button class="btn btn-primary btn-block" id="li-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<div id="app-screen" style="display:none">
  <div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sb-logo">
        <div class="box"><img src="/assets/logo-full.png" alt="QlickLeads"></div>
        <div class="sub">Recruitment Platform</div>
      </div>
      <nav class="sb-nav">
        <div class="sb-lbl">Workspace</div>
        <button class="nav-item" id="nav-analytics" onclick="goto('analytics')"><span class="nav-dot"></span>Analytics</button>
        <button class="nav-item" id="nav-clients" onclick="goto('clients')"><span class="nav-dot"></span>Clients</button>
        <button class="nav-item" id="nav-jobs" onclick="goto('jobs')"><span class="nav-dot"></span>Job Management</button>
        <button class="nav-item" id="nav-cands" onclick="goto('cands')"><span class="nav-dot"></span>Candidates</button>
        <button class="nav-item" id="nav-interview" onclick="goto('interview')"><span class="nav-dot"></span>Interviews</button>
        <button class="nav-item" id="nav-offer" onclick="goto('offer')"><span class="nav-dot"></span>Offers</button>
        <button class="nav-item" id="nav-db" onclick="goto('db')"><span class="nav-dot"></span>Database</button>
        <div class="sb-lbl" id="admin-lbl" style="display:none">Admin</div>
        <button class="nav-item" id="nav-admin" style="display:none" onclick="goto('admin')"><span class="nav-dot"></span>Admin Panel</button>
      </nav>
      <div class="sb-user">
        <div class="un" id="sb-name">—</div>
        <div class="ue" id="sb-email">—</div>
        <button class="btn btn-ghost btn-sm" style="color:rgba(255,255,255,.75);margin-top:8px;padding-left:0" onclick="doLogout()">Sign out</button>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="topbar-l">
          <button class="menu-btn" onclick="toggleSidebar()">☰</button>
          <h1 id="page-title">Analytics</h1>
        </div>
        <div class="topbar-r" id="topbar-actions"></div>
      </div>
      <div class="page" id="page-content"><div style="text-align:center;padding:40px;color:var(--g400)">Loading…</div></div>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal">
    <div class="modal-hdr"><h2 id="modal-title">Title</h2><button class="close-x" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-ftr" id="modal-ftr"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// ══ STATE & HELPERS ══
const S={ view:'analytics', user:null, cache:{}, jobId:null, clientId:null };
const STATUSES=['CV Not Submitted','CV Submitted','HR Rejected','Shortlisted'];
const ST_CLR={'CV Not Submitted':'bdg-gray','CV Submitted':'bdg-blue','HR Rejected':'bdg-red','Shortlisted':'bdg-green'};
const INT_STATUS=['Shortlisted','Interview','Rejected','Offered'];
const IS_CLR={'Shortlisted':'bdg-green','Interview':'bdg-teal','Rejected':'bdg-red','Offered':'bdg-purple'};
const INT_STAGE=['HR Round 1','HR Round 2','HR Round 3','HM Round 1','HM Round 2','HM Round 3'];
const OFFER_STAGES=['Selected','Offer Released','Offer Accepted','Resigned','Joined','30 Days Done'];

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().split('T')[0];
const fmtDate=d=>d?String(d).split('T')[0]:'—';
function badge(v,map){ return v?`<span class="badge ${map[v]||'bdg-gray'}">${esc(v)}</span>`:'<span style="color:var(--g400)">—</span>'; }
function toast(msg,type='ok'){ const t=document.getElementById('toast'); t.textContent=msg; t.className=`toast show ${type}`; clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2600); }
function openModal(title,body,footer,lg){ document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body; document.getElementById('modal-ftr').innerHTML=footer||'';
  document.getElementById('modal').className='modal'+(lg?' lg':''); document.getElementById('modal-ov').classList.add('open'); }
function closeModal(){ document.getElementById('modal-ov').classList.remove('open'); }
async function api(method,path,body){
  const o={method,credentials:'include',headers:{'Content-Type':'application/json'}};
  if(body) o.body=JSON.stringify(body);
  const r=await fetch('/api'+path,o);
  if(r.status===401){ showLogin(); throw new Error('Session expired — please sign in again'); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||`Request failed (${r.status})`);
  return d;
}
// 15s request cache so panels sharing data don't refetch
async function cget(path,ttl=15000){ const h=S.cache[path];
  if(h&&Date.now()-h.t<ttl) return h.v;
  const v=await api('GET',path); S.cache[path]={t:Date.now(),v}; return v; }
function bust(){ S.cache={}; }

// ── Pagination (10/20/50) ──
function paginate(items,key,size){
  const sz=S[`pg_${key}_sz`]||size||10;
  const total=Math.max(1,Math.ceil(items.length/sz));
  let page=Math.min(S[`pg_${key}`]||1,total); S[`pg_${key}`]=page;
  const st=(page-1)*sz;
  return {slice:items.slice(st,st+sz),page,total,sz,from:items.length?st+1:0,to:Math.min(st+sz,items.length),count:items.length};
}
function pager(p,key,fn){
  if(!p.count) return '';
  let nums=[]; if(p.total<=7){for(let i=1;i<=p.total;i++)nums.push(i);}
  else if(p.page<=4)nums=[1,2,3,4,5,'…',p.total];
  else if(p.page>=p.total-3)nums=[1,'…',p.total-4,p.total-3,p.total-2,p.total-1,p.total];
  else nums=[1,'…',p.page-1,p.page,p.page+1,'…',p.total];
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px">
    <span style="font-size:12.5px;color:var(--g500)">Showing ${p.from}–${p.to} of ${p.count}</span>
    <select class="form-select" style="max-width:105px;padding:5px 8px;font-size:12px" onchange="S.pg_${key}_sz=+this.value;S.pg_${key}=1;${fn}">
      ${[10,20,50].map(n=>`<option value="${n}" ${p.sz===n?'selected':''}>${n} / page</option>`).join('')}</select>
    <div style="display:flex;gap:5px;margin-left:auto">
      <button class="btn btn-outline btn-xs" ${p.page<=1?'disabled':''} onclick="S.pg_${key}=${p.page-1};${fn}">‹</button>
      ${nums.map(n=>n==='…'?'<span style="padding:0 5px;color:var(--g400)">…</span>'
        :`<button class="btn btn-xs ${n===p.page?'btn-primary':'btn-outline'}" onclick="S.pg_${key}=${n};${fn}">${n}</button>`).join('')}
      <button class="btn btn-outline btn-xs" ${p.page>=p.total?'disabled':''} onclick="S.pg_${key}=${p.page+1};${fn}">›</button>
    </div></div>`;
}
// ── Card / list toggle ──
function viewToggle(key,fn){ const m=S[`v_${key}`]||'list';
  return `<div style="display:inline-flex;background:var(--g100);border-radius:8px;padding:3px;gap:2px">
    <button class="btn btn-xs" style="border:none;background:${m==='list'?'#fff':'transparent'}" onclick="S.v_${key}='list';${fn}">☰ List</button>
    <button class="btn btn-xs" style="border:none;background:${m==='cards'?'#fff':'transparent'}" onclick="S.v_${key}='cards';${fn}">▦ Cards</button>
  </div>`; }
function metricCard(label,val,o={}){ return `<div class="metric ${o.color||'blue'}">

// ══ AUTH ══
async function doLogin(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  const err=document.getElementById('login-err'); const btn=document.getElementById('li-btn');
  if(!email||!pass){ err.textContent='Enter your email and password'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Signing in…';
  try{ const d=await api('POST','/auth/login',{email,password:pass}); S.user=d.user; startApp(); }
  catch(e){ err.textContent=e.message; err.style.display='block'; }
  btn.disabled=false; btn.textContent='Sign In';
}
async function doLogout(){ try{ await api('POST','/auth/logout'); }catch(e){} S.user=null; showLogin(); }
function showLogin(){ document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none'; }
function startApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('sb-name').textContent=S.user.fullName;
  document.getElementById('sb-email').textContent=S.user.email;
  const isAdmin=S.user.role==='admin';
  document.getElementById('nav-admin').style.display=isAdmin?'flex':'none';
  document.getElementById('admin-lbl').style.display=isAdmin?'block':'none';
  goto('analytics');
}
function toggleSidebar(){
  if(window.innerWidth<=860){ document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open'); }
  else document.body.classList.toggle('sb-collapsed');
}
// ══ ROUTER ══
function goto(view,opts={}){
  S.view=view;
  if(opts.jobId!==undefined)S.jobId=opts.jobId;
  if(opts.clientId!==undefined)S.clientId=opts.clientId;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
  const map={analytics:'nav-analytics',clients:'nav-clients',jobs:'nav-jobs',cands:'nav-cands',
    interview:'nav-interview',offer:'nav-offer',db:'nav-db',admin:'nav-admin'};
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById(map[view]); if(el)el.classList.add('active');
  document.getElementById('topbar-actions').innerHTML='';
  ({analytics:renderAnalytics,clients:renderClients,jobs:renderJobs,cands:renderCands,
    interview:renderInterview,offer:renderOffer,db:renderDb,admin:renderAdmin}[view]||renderAnalytics)();

async function saveJob(id){
  const client_id=document.getElementById('j-client').value;
  const title=document.getElementById('j-title').value.trim();
  if(!client_id){ toast('Client is required','err'); return; }
  if(!title){ toast('Job title is required','err'); return; }
  const btn=document.getElementById('j-save'); btn.disabled=true; btn.textContent='Saving…';
  const data={ client_id:Number(client_id), title,
    budget:document.getElementById('j-budget').value.trim(),
    location:document.getElementById('j-loc').value.trim() };
  try{
    const saved=id?await api('PUT',`/jobs/${id}`,data):await api('POST','/jobs',data);
    const jid=saved.id||id;
    for(const [inp,ep] of [['j-jd','jd'],['j-ps','prescreen']]){
      const f=document.getElementById(inp);
      if(f&&f.files.length){ const fd=new FormData(); fd.append('file',f.files[0]);
        const r=await fetch(`/api/jobs/${jid}/${ep}`,{method:'POST',credentials:'include',body:fd});
        if(!r.ok){ const er=await r.json().catch(()=>({})); throw new Error(er.error||'Upload failed'); } }
    }
    bust(); closeModal(); toast(id?'Job updated':'Job added'); renderJobs();
  }catch(e){ toast(e.message,'err'); btn.disabled=false; btn.textContent=id?'Save Changes':'Add Job'; }
}

async function openFormBuilder(jobId){
  try{
    const qs=await api('GET',`/jobs/${jobId}/form`);
    S.fb=qs.map(q=>({...q}));
    S.fbJob=jobId; renderFormBuilder();
  }catch(e){ toast(e.message,'err'); }
}
function renderFormBuilder(){
  const rows=S.fb.map((q,i)=>`
    <div class="fs" style="margin-bottom:10px">
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div style="flex:1">
          <div class="form-grid">
            <div class="form-row"><label class="form-label">Question ${i+1}</label>
              <input class="form-input" value="${esc(q.label||'')}" oninput="S.fb[${i}].label=this.value"></div>
            <div class="form-row"><label class="form-label">Type</label>
              <select class="form-select" onchange="S.fb[${i}].type=this.value;renderFormBuilder()">
                <option value="text" ${q.type==='text'?'selected':''}>Text Input</option>
                <option value="single" ${q.type==='single'?'selected':''}>Single Select MCQ</option>
                <option value="multi" ${q.type==='multi'?'selected':''}>Multi Select MCQ</option>
              </select></div>
          </div>
          ${q.type!=='text'?`<div class="form-row"><label class="form-label">Options (comma separated)</label>
            <input class="form-input" value="${esc((q.options||[]).join(', '))}" oninput="S.fb[${i}].options=this.value.split(',').map(s=>s.trim()).filter(Boolean)"></div>`:''}
          <label style="font-size:12px;display:flex;align-items:center;gap:7px;cursor:pointer">
            <input type="checkbox" ${q.required?'checked':''} onchange="S.fb[${i}].required=this.checked" style="width:auto"> Required</label>
        </div>
        <button class="btn btn-danger btn-xs" onclick="S.fb.splice(${i},1);renderFormBuilder()">×</button>
      </div>
    </div>`).join('')||'<div style="text-align:center;padding:20px;color:var(--g400);font-size:12.5px">No questions yet — add the first one below.</div>';
  openModal('Pre-screening Form',`
    <p style="font-size:12.5px;color:var(--g600);margin-bottom:12px">Recruiters answer these while adding a candidate to this job.</p>
    <div id="fb-rows">${rows}</div>
    <button class="btn btn-outline btn-sm" onclick="S.fb.push({type:'text',label:'',options:[],required:false});renderFormBuilder()">+ Add Question</button>`,
    `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveFormBuilder()">Save Form</button>`, true);
}
async function saveFormBuilder(){
  const qs=S.fb.filter(q=>(q.label||'').trim());
  try{ await api('PUT',`/jobs/${S.fbJob}/form`,{questions:qs});
    bust(); closeModal(); toast('Screening form saved'); renderJobs(); }
  catch(e){ toast(e.message,'err'); }
}

async function saveCand(id, jobId){
  const name=document.getElementById('x-name').value.trim();
  if(!name){ toast('Candidate name is required','err'); return; }
  const brief=document.getElementById('x-brief').value.trim();
  if(!brief){ toast('Candidate brief is required','err'); document.getElementById('x-brief').focus(); return; }

  // Collect pre-screening answers and enforce any question marked required
  const answers=[]; let missing=null;
  document.querySelectorAll('.ps-q').forEach(el=>{
    const t=el.dataset.type, qid=el.dataset.qid;
    const req=el.dataset.req==='1', label=el.dataset.label||'a question';
    const value = (t==='multi')
      ? [...el.querySelectorAll('.ps-opt:checked')].map(x=>x.value)
      : el.value;
    const empty = Array.isArray(value) ? value.length===0 : !String(value).trim();
    if(req && empty && !missing) missing=label;
    answers.push({ id:qid, value });
  });
  if(missing){ toast(`Pre-screening: "${missing}" is required`,'err'); return; }
  const btn=document.getElementById('x-save'); btn.disabled=true; btn.textContent='Saving…';
  const data={ job_id:Number(jobId), name,
    recruiter_name:document.getElementById('x-rec').value.trim(),
    current_location:document.getElementById('x-loc').value.trim(),
    applying_location:document.getElementById('x-apply').value.trim(),
    last_org:document.getElementById('x-org').value.trim(),
    last_designation:document.getElementById('x-desig').value.trim(),
    current_ctc:document.getElementById('x-cctc').value.trim(),
    expected_ctc:document.getElementById('x-ectc').value.trim(),
    match_score:document.getElementById('x-score').value,
    brief,
    status:document.getElementById('x-status').value,
    prescreen_answers:answers };
  try{
    const saved=id?await api('PUT',`/candidates/${id}`,data):await api('POST','/candidates',data);
    const cid=saved.id||id;
    for(const [inp,ep] of [['x-cv','cv'],['x-rep','report']]){
      const f=document.getElementById(inp);
      if(f&&f.files.length){ const fd=new FormData(); fd.append('file',f.files[0]);
        const r=await fetch(`/api/candidates/${cid}/${ep}`,{method:'POST',credentials:'include',body:fd});
        if(!r.ok){ const er=await r.json().catch(()=>({})); throw new Error(er.error||'Upload failed'); } }
    }
    bust(); closeModal(); toast(id?'Candidate updated':'Candidate added');
    (S.view==='db'?renderDb:S.view==='interview'?renderInterview:renderCands)();
  }catch(e){ toast(e.message,'err'); btn.disabled=false; btn.textContent=id?'Save Changes':'Add Candidate'; }
}

async function patchCand(id,patch){

        <input class="form-input" id="u-pass" type="password" placeholder="${id?'Leave blank to keep':'Set a password'}"></div>
    </div>
    ${id?`<label style="font-size:12.5px;display:flex;align-items:center;gap:8px;cursor:pointer">

async function saveUser(id){
  const full_name=document.getElementById('u-name').value.trim();
  const email=document.getElementById('u-email').value.trim();
  const password=document.getElementById('u-pass').value;
  const role=document.getElementById('u-role').value;
  if(!full_name){ toast('Name is required','err'); return; }
  if(!id&&(!email||!password)){ toast('Email and password are required','err'); return; }
  try{
    if(id){ const d={full_name,role,is_active:document.getElementById('u-active').checked};
      if(password) d.password=password; await api('PUT',`/admin/users/${id}`,d); }
    else await api('POST','/admin/users',{full_name,email,password,role});
    closeModal(); toast(id?'User updated':'User created'); renderAdmin();
  }catch(e){ toast(e.message,'err'); }
}
async function delUser(id){
  if(!confirm('Delete this user?'))return;
  try{ await api('DELETE',`/admin/users/${id}`); toast('User deleted'); renderAdmin(); }
  catch(e){ toast(e.message,'err'); }
}

    <button class="subtab ${t==='alerts'?'active':''}" onclick="S.adminTab='alerts';renderAdmin()">Alerts${count?` <span class="cnt">${count}</span>`:''}</button>
  </div>`;
}

          <option value="medium" ${S.alSev==='medium'?'selected':''}>7–9 days</option>
          <option value="high" ${S.alSev==='high'?'selected':''}>10+ days</option></select>
        ${(S.alRec||S.alJob||S.alSev)?`<button class="btn btn-ghost btn-sm" onclick="S.alRec=null;S.alJob=null;S.alSev=null;renderAdminAlerts()">Clear</button>`:''}
        <span style="margin-left:auto;font-size:12.5px;color:var(--g400)">${f.length} of ${d.count} stale</span>
      </div>
      ${f.length?`<div class="tbl-wrap"><table style="min-width:900px">
        <thead><tr><th>Candidate</th><th>Job / Client</th><th>Current Status</th><th>Interview</th><th>Recruiter</th><th>Idle</th><th>Action</th></tr></thead>
        <tbody>${p.slice.map(a=>{
          const col=a.severity==='high'?'#e8615a':a.severity==='medium'?'#f0a02a':'#2563c9';
          return `<tr>
            <td><div class="td-link" onclick="openCandForm(${a.id})">${esc(a.name)}</div></td>
            <td style="font-size:12px">${esc(a.job_title)}<div class="td-sub">${esc(a.client_name)}</div></td>
            <td>${badge(a.status,ST_CLR)}</td>
            <td>${a.interview_status?badge(a.interview_status,IS_CLR):'<span style="color:var(--g400)">—</span>'}</td>
            <td style="font-size:12px">${esc(a.recruiter)}</td>
            <td><span class="badge" style="background:${col}1a;color:${col}">${a.days} days</span>
              <div class="td-sub">since ${fmtDate(a.last_touch)}</div></td>
            <td><button class="btn btn-primary btn-xs" onclick="openCandForm(${a.id})">Update</button></td>
          </tr>`;}).join('')}</tbody></table></div>${pager(p,'al','renderAdminAlerts()')}`
        :'<div class="empty-state"><div class="ei">✅</div><h3>Nothing stale</h3><p>Every candidate has been updated within the last 4 days.</p></div>'}`;
  }catch(e){ el.innerHTML=adminTabs()+`<div class="empty-state"><p style="color:var(--r1)">${esc(e.message)}</p></div>`; }
}

// ══ BOOT ══
window.addEventListener('resize',()=>{
  if(window.innerWidth>860){ document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open'); }
  else document.body.classList.remove('sb-collapsed');
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
['li-email','li-pass'].forEach(id=>{ const el=document.getElementById(id);
  if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter')doLogin(); }); });
(async()=>{
  try{ const me=await api('GET','/auth/me'); S.user={id:me.id,email:me.email,fullName:me.fullName,role:me.role}; startApp(); }
  catch(e){ showLogin(); }
})();
</script>
</body>
</html>
